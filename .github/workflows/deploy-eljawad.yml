name: Deploy site to eljawad.com (HostGator)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "full = build + deploy whole site"
        required: true
        default: full
        type: choice
        options: [full]

concurrency:
  group: deploy-eljawad
  cancel-in-progress: false

env:
  SRV: yqjezvte@gator4421.hostgator.com
  WEBROOT: /home2/yqjezvte/public_html/eljawad-motors
  # Eljawad's own PHP backend, uploaded into $WEBROOT/server by this workflow.
  # The build leaves NEXT_PUBLIC_API_BASE_URL unset so the site calls the
  # relative /server on its own domain (eljawad.com/server) - same-origin, so
  # the SameSite=Strict session cookie works. This URL is the same folder via
  # artisbay.com and is only used by the Verify step.
  API_BASE: https://artisbay.com/eljawad-motors/server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HostGator sometimes drops new SSH connections ("Connection closed by
      # ... port 22", exit 255). So: one shared connection for every ssh/scp
      # below (ControlMaster), and a retry helper for dropped connections.
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HG_ELJAWAD_SSH_KEY }}" > ~/.ssh/hg_key
          chmod 600 ~/.ssh/hg_key
          cat > ~/.ssh/config <<EOF
          Host hg
            HostName ${SRV#*@}
            User ${SRV%@*}
            IdentityFile ~/.ssh/hg_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 15
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config
          cat > "$RUNNER_TEMP/ssh-retry.sh" <<'EOF'
          # retry <cmd...>: re-run on exit 255 (ssh/scp connection failure),
          # up to 4 tries; any other exit code is returned as-is.
          retry() {
            local n=1 rc
            while true; do
              "$@" && return 0
              rc=$?
              [ "$rc" -ne 255 ] && return "$rc"
              [ "$n" -ge 4 ] && return 255
              echo "::warning::SSH connection failed (attempt $n/4), retrying in $((n * 15))s"
              sleep $((n * 15))
              n=$((n + 1))
            done
          }
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Keeps next/font's downloaded Google Fonts (and webpack output) between
      # runs; without it every build re-fetches the fonts and a flaky fetch
      # fails the whole build. Own key prefix: the Pages build uses a
      # different basePath, so their caches must not mix.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-eljawad-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-eljawad-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build Next.js
        run: |
          pnpm install --frozen-lockfile
          # Retry: a transient Google Fonts fetch failure shouldn't need a manual re-run.
          for attempt in 1 2 3; do
            pnpm run build && exit 0
            echo "Build attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Deploy to HostGator
        run: |
          source "$RUNNER_TEMP/ssh-retry.sh"
          tar -czf deploy_site.tar.gz -C out .
          retry scp deploy_site.tar.gz "hg:/home2/yqjezvte/"
          retry ssh hg \
            "mkdir -p $WEBROOT && tar xzf /home2/yqjezvte/deploy_site.tar.gz -C $WEBROOT/ && \
             rm -f /home2/yqjezvte/deploy_site.tar.gz && \
             find $WEBROOT -type d -exec chmod 755 {} \; && \
             find $WEBROOT -type f -exec chmod 644 {} \; && \
             echo DEPLOY_DONE"

      # db_connection.php and mail_secrets.php hold this site's own DB/mail
      # credentials and live only on the host - never overwrite them with the
      # repo copies (the repo's db_connection.php is a local root/localhost one).
      # Refuses to deploy until the host-side db_connection.php exists.
      - name: Deploy PHP backend (server/)
        run: |
          source "$RUNNER_TEMP/ssh-retry.sh"
          # `test -f` exits 1 only when the file is really missing; 255 means
          # we couldn't reach the host (don't report that as "missing").
          rc=0
          retry ssh hg "test -f $WEBROOT/server/core/db_connection.php" || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "Missing $WEBROOT/server/core/db_connection.php on host - create it first"; exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "Could not connect to HostGator over SSH (exit $rc) - try again later"; exit 1
          fi
          tar -czf deploy_server.tar.gz \
            --exclude='core/db_connection.php' --exclude='core/mail_secrets.php' \
            --exclude='error_log.txt' --exclude='Invoice.pdf' \
            -C server .
          retry scp deploy_server.tar.gz "hg:/home2/yqjezvte/"
          retry ssh hg \
            "tar xzf /home2/yqjezvte/deploy_server.tar.gz -C $WEBROOT/server/ && \
             rm -f /home2/yqjezvte/deploy_server.tar.gz && \
             find $WEBROOT/server -type d -exec chmod 755 {} \; && \
             find $WEBROOT/server -type f -exec chmod 644 {} \; && \
             echo SERVER_DONE"

      - name: Verify
        run: |
          curl -sf -o /dev/null -w "site: %{http_code}\n" https://eljawad.com || echo "eljawad.com not reachable yet (DNS?)"
          # Must be real JSON - an HTML 200 means the host's SPA fallback
          # answered because the PHP isn't there.
          curl -s "$API_BASE/inventory/cars/fetchStock.php" | head -c 1 | grep -q '\[' \
            && echo "backend: real JSON OK" || { echo "backend: NOT returning JSON"; exit 1; }
