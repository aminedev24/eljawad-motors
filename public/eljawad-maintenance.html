<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Eljawad Motors – Temporarily unavailable</title>
  <link rel="icon" href="/icons/favicon.ico">
  <style>
    :root { --navy: #0f4c5c; --orange: #e8622c; --text: #1f2937; --muted: #6b7280; --bg: #f3f4f6; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --text: #e5e7eb; --muted: #9ca3af; --bg: #0b1220; --card: #111827; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { width: 100%; max-width: 520px; background: var(--card); border-top: 4px solid var(--orange); border-radius: 8px;
           padding: 40px 32px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .08); }
    img { width: 180px; height: auto; margin-bottom: 24px; }
    h1 { margin: 0 0 12px; font-size: 24px; color: var(--navy); }
    @media (prefers-color-scheme: dark) { h1 { color: #5eb7c9; } }
    p { margin: 0 0 12px; line-height: 1.6; color: var(--muted); }
    a { color: var(--orange); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img src="/images/logo-eljawad-dark.svg" alt="Eljawad Motors">
    <h1>We'll be back soon</h1>
    <p>Eljawad Motors is temporarily unavailable while we make some changes.</p>
    <p>Questions in the meantime? Email us at <a href="mailto:contact@eljawad.com">contact@eljawad.com</a>.</p>
  </main>
</body>
</html>
